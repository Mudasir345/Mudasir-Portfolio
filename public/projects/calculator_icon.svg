<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Presentation Area -->
  <rect width="800" height="600" fill="#0F172A"/>
  <defs>
    <linearGradient id="screenGradient" x1="275" y1="80" x2="525" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bodyGradient" x1="250" y1="50" x2="550" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentBtnGradient" x1="219" y1="36" x2="219" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
     <filter id="btnShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect x="250" y="50" width="300" height="520" rx="45" fill="url(#bodyGradient)" stroke="#475569" stroke-width="4"/>
  
  <!-- Status Bar Details (Fake) -->
  <text x="280" y="75" fill="#94A3B8" font-family="sans-serif" font-size="12">9:41</text>
  <rect x="510" y="66" width="20" height="10" rx="2" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <rect x="512" y="68" width="16" height="6" rx="1" fill="#94A3B8"/>

  <!-- Main Screen Area -->
  <rect x="270" y="90" width="260" height="140" rx="15" fill="url(#screenGradient)" stroke="#334155" stroke-width="1"/>
  
  <!-- Screen Text -->
  <text x="510" y="140" fill="#94A3B8" font-family="monospace" font-size="16" text-anchor="end">sin(45) × π</text>
  <text x="510" y="190" fill="#38BDF8" font-family="sans-serif" font-size="42" text-anchor="end" font-weight="light">2.221</text>

  <!-- Scientific Row (Small) -->
  <g transform="translate(270, 250)">
     <text x="15" y="0" fill="#64748B" font-family="sans-serif" font-size="12">deg</text>
     <text x="55" y="0" fill="#64748B" font-family="sans-serif" font-size="12">sin</text>
     <text x="95" y="0" fill="#64748B" font-family="sans-serif" font-size="12">cos</text>
     <text x="135" y="0" fill="#64748B" font-family="sans-serif" font-size="12">tan</text>
     <text x="175" y="0" fill="#64748B" font-family="sans-serif" font-size="12">ln</text>
     <text x="215" y="0" fill="#64748B" font-family="sans-serif" font-size="12">log</text>
  </g>

  <!-- Buttons Grid -->
  <g transform="translate(275, 280)">
    <!-- Row 1: Function Keys -->
    <circle cx="30" cy="30" r="26" fill="#64748B" filter="url(#btnShadow)"/> <text x="30" y="35" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle">AC</text>
    <circle cx="93" cy="30" r="26" fill="#64748B" filter="url(#btnShadow)"/> <text x="93" y="35" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle">+/-</text>
    <circle cx="156" cy="30" r="26" fill="#64748B" filter="url(#btnShadow)"/> <text x="156" y="35" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle">%</text>
    <circle cx="219" cy="30" r="26" fill="#F59E0B" filter="url(#btnShadow)"/> <text x="219" y="35" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">÷</text>
    
    <!-- Row 2 -->
    <circle cx="30" cy="90" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="30" y="96" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">7</text>
    <circle cx="93" cy="90" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="93" y="96" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">8</text>
    <circle cx="156" cy="90" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="156" y="96" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">9</text>
    <circle cx="219" cy="90" r="26" fill="#F59E0B" filter="url(#btnShadow)"/> <text x="219" y="94" fill="white" font-family="sans-serif" font-size="18" text-anchor="middle">×</text>
    
    <!-- Row 3 -->
    <circle cx="30" cy="150" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="30" y="156" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">4</text>
    <circle cx="93" cy="150" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="93" y="156" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">5</text>
    <circle cx="156" cy="150" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="156" y="156" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">6</text>
    <circle cx="219" cy="150" r="26" fill="#F59E0B" filter="url(#btnShadow)"/> <text x="219" y="156" fill="white" font-family="sans-serif" font-size="24" text-anchor="middle">-</text>
    
    <!-- Row 4 -->
    <circle cx="30" cy="210" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="30" y="216" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">1</text>
    <circle cx="93" cy="210" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="93" y="216" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">2</text>
    <circle cx="156" cy="210" r="26" fill="#334155" filter="url(#btnShadow)"/> <text x="156" y="216" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">3</text>
    <circle cx="219" cy="210" r="26" fill="#F59E0B" filter="url(#btnShadow)"/> <text x="219" y="216" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">+</text>

    <!-- Row 5 (Rect Zero + Dot + Equals) -->
    <rect x="4" y="244" width="116" height="52" rx="26" fill="#334155" filter="url(#btnShadow)"/> 
    <text x="40" y="278" fill="white" font-family="sans-serif" font-size="20" text-anchor="middle">0</text>
    
    <circle cx="156" cy="270" r="26" fill="#334155" filter="url(#btnShadow)"/> 
    <text x="156" y="276" fill="white" font-family="sans-serif" font-size="24" text-anchor="middle">.</text>
    
    <circle cx="219" cy="270" r="26" fill="#EA580C" filter="url(#btnShadow)"/> 
    <text x="219" y="278" fill="white" font-family="sans-serif" font-size="24" text-anchor="middle">=</text>
  </g>
</svg>
