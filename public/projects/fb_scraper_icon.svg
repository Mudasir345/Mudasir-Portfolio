<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Browser Window Background (No Filters, just stroke) -->
  <rect x="50" y="50" width="700" height="500" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Toolbar -->
  <path d="M50 58C50 53.5817 53.5817 50 58 50H742C746.418 50 750 53.5817 750 58V90H50V58Z" fill="#E2E8F0"/>
  <circle cx="75" cy="70" r="6" fill="#EF4444"/>
  <circle cx="95" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="115" cy="70" r="6" fill="#10B981"/>
  
  <!-- Address Bar -->
  <rect x="150" y="58" width="400" height="24" rx="4" fill="white"/>
  <text x="160" y="75" fill="#64748B" font-family="sans-serif" font-size="12">facebook.com/marketplace/search</text>

  <!-- Marketplace Header (Fake) -->
  <rect x="52" y="92" width="696" height="50" fill="#FFFFFF"/>
  <line x1="50" y1="140" x2="750" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="120" fill="#1E293B" font-family="sans-serif" font-size="18" font-weight="bold">Marketplace</text>
  
  <!-- Content Placeholders -->
  <rect x="70" y="160" width="120" height="150" rx="4" fill="#E2E8F0"/>
  <rect x="210" y="160" width="120" height="150" rx="4" fill="#E2E8F0"/>
  <rect x="350" y="160" width="120" height="150" rx="4" fill="#E2E8F0"/>
  
  <!-- Scraper Overlay / Extension Popup (Flat Design) -->
  <rect x="520" y="100" width="220" height="430" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  
  <!-- Extension Header -->
  <rect x="521" y="101" width="218" height="50" fill="#0F172A"/>
  <text x="540" y="130" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">FB Scraper Pro</text>
  <circle cx="720" cy="125" r="4" fill="#10B981"/>
  
  <!-- Stats Grid -->
  <text x="540" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">TOTAL SCRAPED</text>
  <text x="540" y="190" fill="#38BDF8" font-family="sans-serif" font-size="24" font-weight="bold">2,451</text>
  
  <text x="640" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">IMAGES</text>
  <text x="640" y="190" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="bold">8.5k</text>

  <!-- Progress Bar -->
  <text x="540" y="230" fill="#CBD5E1" font-family="sans-serif" font-size="12">Crawling Page 14...</text>
  <rect x="540" y="240" width="180" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="240" width="120" height="6" rx="3" fill="#3B82F6"/>
  
  <!-- Log Console -->
  <rect x="535" y="270" width="190" height="200" rx="4" fill="#0F172A" stroke="#334155"/>
  <text x="545" y="290" fill="#64748B" font-family="monospace" font-size="10">&gt; Found Item: iPhone 13</text>
  <text x="545" y="305" fill="#64748B" font-family="monospace" font-size="10">&gt; Extract Price: $500</text>
  <text x="545" y="320" fill="#10B981" font-family="monospace" font-size="10">&gt; Saved to CSV row #2451</text>
  <text x="545" y="335" fill="#64748B" font-family="monospace" font-size="10">&gt; Scanning next card...</text>
  
  <!-- Export Button -->
  <rect x="535" y="490" width="190" height="30" rx="4" fill="#2563EB"/>
  <text x="630" y="510" fill="white" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Stop & Export Data</text>
</svg>
