<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0F172A"/>
  <rect x="250" y="50" width="300" height="500" rx="40" fill="#1E293B" stroke="#334155" stroke-width="8"/>
  
  <!-- App Header -->
  <text x="400" y="90" fill="white" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Stopwatch</text>
  
  <!-- Timer Circle -->
  <circle cx="400" cy="220" r="100" stroke="#334155" stroke-width="8" fill="none"/>
  <circle cx="400" cy="220" r="100" stroke="#22C55E" stroke-width="8" stroke-dasharray="628" stroke-dashoffset="157" stroke-linecap="round" fill="none" transform="rotate(-90 400 220)"/>
  
  <!-- Time Display -->
  <text x="400" y="230" fill="white" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">00:14.58</text>
  
  <!-- Lap List -->
  <rect x="275" y="360" width="250" height="40" rx="8" fill="#334155" opacity="0.5"/>
  <text x="290" y="385" fill="#94A3B8" font-family="sans-serif" font-size="14">Lap 3</text>
  <text x="510" y="385" fill="white" font-family="monospace" font-size="14" text-anchor="end">00:04.12</text>
  
  <rect x="275" y="410" width="250" height="40" rx="8" fill="none"/>
  <text x="290" y="435" fill="#64748B" font-family="sans-serif" font-size="14">Lap 2</text>
  <text x="510" y="435" fill="#94A3B8" font-family="monospace" font-size="14" text-anchor="end">00:05.30</text>

  <!-- Buttons -->
  <circle cx="320" cy="500" r="25" fill="#334155"/>
  <text x="320" y="505" fill="white" font-family="sans-serif" font-size="12" text-anchor="middle">Lap</text>

  <circle cx="480" cy="500" r="25" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
  <text x="480" y="505" fill="#22C55E" font-family="sans-serif" font-size="12" text-anchor="middle">Stop</text>
</svg>
