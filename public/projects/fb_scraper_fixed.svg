<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1E293B"/>
  
  <!-- Browser Window Frame -->
  <rect x="50" y="80" width="700" height="440" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="80" width="700" height="40" rx="8" fill="#334155"/>
  <rect x="50" y="110" width="700" height="10" fill="#334155"/> <!-- Square off bottom of header -->
  
  <!-- Window Controls -->
  <circle cx="80" cy="100" r="6" fill="#EF4444"/>
  <circle cx="100" cy="100" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="100" r="6" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="150" y="90" width="400" height="20" rx="4" fill="#1E293B"/>
  <text x="160" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10">facebook.com/marketplace</text>
  
  <!-- Extension Icon Active -->
  <circle cx="680" cy="100" r="8" fill="#3B82F6"/>
  
  <!-- Main Page Content (Abstract Listings) -->
  <rect x="80" y="150" width="140" height="160" rx="4" fill="#1E293B" stroke="#334155"/>
  <rect x="90" y="160" width="120" height="80" rx="2" fill="#334155"/>
  <rect x="90" y="250" width="80" height="10" rx="2" fill="#64748B"/>
  <rect x="90" y="270" width="40" height="10" rx="2" fill="#3B82F6"/>
  
  <rect x="250" y="150" width="140" height="160" rx="4" fill="#1E293B" stroke="#334155"/>
  <rect x="260" y="160" width="120" height="80" rx="2" fill="#334155"/>
  <rect x="260" y="250" width="80" height="10" rx="2" fill="#64748B"/>
  <rect x="260" y="270" width="40" height="10" rx="2" fill="#3B82F6"/>
  
  <rect x="420" y="150" width="140" height="160" rx="4" fill="#1E293B" stroke="#334155"/>
  <rect x="430" y="160" width="120" height="80" rx="2" fill="#334155"/>
  <rect x="430" y="250" width="80" height="10" rx="2" fill="#64748B"/>
  <rect x="430" y="270" width="40" height="10" rx="2" fill="#3B82F6"/>
  
  <!-- Scraper Overlay (The 'Extension' UI) -->
  <rect x="500" y="130" width="220" height="350" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="500" y="130" width="220" height="40" rx="4" fill="#3B82F6"/>
  <rect x="500" y="160" width="220" height="10" fill="#3B82F6"/>
  <text x="610" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">FB Scraper Tool</text>
  
  <!-- Scraper Stats -->
  <text x="520" y="200" fill="#94A3B8" font-family="sans-serif" font-size="12">Items Collected</text>
  <text x="520" y="230" fill="#10B981" font-family="sans-serif" font-size="32" font-weight="bold">2,450</text>
  
  <!-- Progress -->
  <rect x="520" y="260" width="180" height="6" rx="3" fill="#334155"/>
  <rect x="520" y="260" width="100" height="6" rx="3" fill="#10B981"/>
  <text x="520" y="280" fill="#64748B" font-family="sans-serif" font-size="10">Processing...</text>
  
  <!-- Export Button -->
  <rect x="520" y="440" width="180" height="30" rx="4" fill="#3B82F6"/>
  <text x="610" y="460" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Download CSV</text>
</svg>
